/* ChemLab 10.0 realistic digital laboratory */
.lab.realistic{min-height:590px;background:

 0%{transform:translate(-50%,0) scale(1);opacity:1}

  50%{transform:translate(-8px,2px) scale(.62);opacity:.9}

function atomHTML(e){let max=260;return `<div class=atom><div class=nucleus></div>${e[4].map((cnt,s)=>{let size=90+s*38;let dots=Array.from({length:cnt},(_,i)=>{let a=2*Math.PI*i/cnt,x=size/2+Math.cos(a)*size/2-4.5,y=size/2+Math.sin(a)*size/2-4.5;return `<i class=electron style="left:${x}px;top:${y}px"></i>`}).join("");return `<div class=shell style="width:${size}px;height:${size}px;margin-left:${-size/2}px;margin-top:${-size/2}px">${dots}</div>`}).join("")}</div>`}
function detail(e){let d=document.getElementById("edetail");if(!d){mode="elements";render();d=document.getElementById("edetail")}d.innerHTML=`<div style="display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1fr);gap:14px"><div class=card><h3>${e[1]} (${e[0]})</h3><div class=sample><div class=chunk style="background:linear-gradient(135deg,#fff8,${e[6]},#0007),${e[6]}"></div></div><p class=muted>Сыртқы көрінісінің цифрлық үлгісі (нақты фотосурет емес).</p><b>Реттік нөмірі:</b> ${e[2]}<br><b>Салыстырмалы атомдық массасы:</b> ${e[3]}<br><b>Түрі:</b> ${e[7]}<br><b>Жалын белгісі:</b> ${e[8]}</div><div class=card><h3>Электрондық құрылыс</h3>${atomHTML(e)}<b>Электрон саны:</b> ${e[2]}<br><b>Электрондық деңгей саны:</b> ${e[4].length}<br><b>Қабаттар:</b> ${e[4].join(" · ")}<br><b>Конфигурация:</b> ${e[5]}</div></div>`}

const burnInfo={
 Li:{name:"Литий",sample:"#c9c9c9",flame:"#e63845",core:"#ffd0d5",text:"кармин-қызыл",kind:"Жалын сынағында Li⁺ тән түс береді."},
 Na:{name:"Натрий",sample:"#d3d3d0",flame:"#ffd326",core:"#fff7a8",text:"ашық сары",kind:"Жалын сынағында Na⁺ өте айқын сары түс береді."},
 K:{name:"Калий",sample:"#b8b8bd",flame:"#ad72ff",core:"#ead8ff",text:"күлгін",kind:"Жалын сынағында K⁺ күлгін реңк береді."},
 Ca:{name:"Кальций",sample:"#bfc3c5",flame:"#f05a3b",core:"#ffd1bb",text:"қызғылт-сары-қызыл",kind:"Жалын сынағында Ca²⁺ тән түс береді."},
 Mg:{name:"Магний",sample:"#c9cdd0",flame:"#ffffff",core:"#ffffff",text:"өте жарық ақ сәуле",kind:"Бұл — магнийдің жану көрінісі; Mg²⁺ үшін диагностикалық жалын түсі емес."},
 Sr:{name:"Стронций",sample:"#c4c8c9",flame:"#e52f46",core:"#ffd0d5",text:"қызыл",kind:"Жалын сынағында Sr²⁺ қызыл реңк береді."},
 Ba:{name:"Барий",sample:"#c3c8c2",flame:"#7ddb5a",core:"#dcffd0",text:"алма-жасыл",kind:"Жалын сынағында Ba²⁺ жасыл реңк береді."},
 Cu:{name:"Мыс",sample:"#b96b43",flame:"#25c8a5",core:"#c9fff4",text:"көкшіл-жасыл",kind:"Кейбір мыс қосылыстары жалын сынағында көкшіл-жасыл түс береді."},
 Fe:{name:"Темір",sample:"#747a7d",flame:"#ff9a35",core:"#ffe2b8",text:"қызған ұшқындар",kind:"Темір үшін бұл Na сияқты диагностикалық жалын сынағы емес; цифрлық жану эффектісі."},
 C:{name:"Көміртек",sample:"#252525",flame:"#ff7a25",core:"#ffd6a3",text:"жану визуализациясы",kind:"Көміртектің жануы жалын сынағынан бөлек көрсетіледі."},
 S:{name:"Күкірт",sample:"#e5d128",flame:"#2588ff",core:"#bfe7ff",text:"көк жалын",kind:"Күкірттің жануы көк жалын ретінде модельденеді."}
};
function selectBurn(s){
 selectedBurn=s;let d=burnInfo[s],sm=document.getElementById("burnSample"),r=document.getElementById("burnReadout");
 if(sm)sm.style.background=`linear-gradient(135deg,#fff9,${d.sample},#0005)`;
 if(r)r.innerHTML=`<b>${d.name} (${s}) таңдалды</b><br><span class=muted>«Жағу» батырмасын басыңыз.</span>`;
 stopBurn(false);
}
function igniteSelected(){
 let r=document.getElementById("burnReadout"),f=document.getElementById("bigFlame"),sp=document.getElementById("sparks");
 if(!selectedBurn){if(r)r.innerHTML="<b>Алдымен элемент таңдаңыз.</b>";return}
 let d=burnInfo[selectedBurn]; f.style.setProperty("--flame",d.flame);f.style.setProperty("--core",d.core);f.classList.add("on");
 if(sp)sp.innerHTML=(selectedBurn==="Fe"||selectedBurn==="Mg")?Array.from({length:15},(_,i)=>`<i class=spark style="left:${130+(i%5)*13}px;bottom:${120+(i%3)*8}px;--dx:${(i%2?1:-1)*(25+i*3)}px;animation-delay:${(i%6)*.12}s"></i>`).join(""):"";
 if(r)r.innerHTML=`<b>🔥 ${d.name}: ${d.text}</b><br>${d.kind}<br><span class=muted>Цифрлық оқу симуляциясы.</span>`;
}
function stopBurn(clear=true){let f=document.getElementById("bigFlame"),sp=document.getElementById("sparks");if(f)f.classList.remove("on");if(sp)sp.innerHTML="";if(clear){let r=document.getElementById("burnReadout");if(r&&selectedBurn)r.innerHTML=`<b>${burnInfo[selectedBurn].name} (${selectedBurn})</b><br><span class=muted>Жалын өшірілді. Қайта жағуға болады.</span>`}}
function sampleHTML(e){
 return `<div class=sample style="width:240px;margin:25px auto 0"><div class=chunk style="background:linear-gradient(135deg,#fff8,${e[6]},#0008),${e[6]}"></div></div>`;
}
function visualFlame(color, glow=color){
 return `<div class=flame style="background:radial-gradient(circle at 65% 65%,#fff 0 8%,${color} 28%,${color} 55%,transparent 70%);filter:drop-shadow(0 0 30px ${glow})"></div>`;
}
function burnElement(e){
 let area=document.getElementById("flameArea"), n=document.getElementById("burnName");
 const combustion={
  "Mg":["Өте жарық ақ сәуле/жану","#ffffff","2Mg + O₂ → 2MgO"],
  "S":["Көк жалын","#2588ff","S + O₂ → SO₂"],
  "C":["Қыздыру/жану визуализациясы","#ff7a25","C + O₂ → CO₂"],
  "Fe":["Қызған бөлшектердің цифрлық эффектісі","#ff9a35","Темірдің жануы жағдайға тәуелді; бұл — оқу визуализациясы."],
  "Cu":["Айқын жалын түсі ретінде қолданылмайды","#ff7a25","Мыс металының жануын жалын сынағымен шатастырмаңыз."]
 };
 let d=combustion[e[0]];
 n.innerHTML=`<b>🔥 Элементті жағу: ${e[1]} (${e[0]})</b>`;
 if(!d){area.innerHTML=sampleHTML(e)+`<div class=card style="max-width:520px;margin:25px auto">Бұл элемент үшін жану моделі енгізілмеген.</div>`;return}
 let flame=(e[0]==="Cu")?`<div class=card style="max-width:520px;margin:30px auto;text-align:center"><b>Жалын сынағы бөлімін пайдаланыңыз.</b></div>`:visualFlame(d[1]);
 area.innerHTML=sampleHTML(e)+flame+`<div class=card style="max-width:540px;margin:15px auto"><b>${d[0]}</b><br>${d[2]}<br><span class=muted>Тек цифрлық оқу симуляциясы.</span></div>`;
}
function flameTest(e){
 let area=document.getElementById("flameArea"), n=document.getElementById("burnName");
 const tests={
  "Li":["кармин-қызыл","#e63845","Li⁺"],
  "Na":["ашық сары","#ffd326","Na⁺"],
  "K":["күлгін","#ad72ff","K⁺"],
  "Ca":["кірпіш-қызыл / қызғылт-сары-қызыл","#f05a3b","Ca²⁺"],
  "Ba":["алма-жасыл","#7ddb5a","Ba²⁺"],
  "Cu":["көкшіл-жасыл","#25c8a5","Cu қосылыстары"]
 };
 let d=tests[e[0]];
 n.innerHTML=`<b>🎨 Жалын сынағы: ${e[1]} (${d?d[2]:e[0]})</b>`;
 if(!d){area.innerHTML=`<div class=card style="max-width:520px;margin:35px auto">Бұл ион үшін айқын диагностикалық жалын түсі көрсетілмейді.</div>`;return}
 area.innerHTML=sampleHTML(e)+visualFlame(d[1])+`<div class=card style="max-width:540px;margin:15px auto">Жалын түсі: <b>${d[0]}</b><br><span class=muted>Бұл — цифрлық жалын сынағының оқу визуализациясы.</span></div>`;
}

function qclMetalWaterVisual(){
  const m=document.getElementById("metalPiece");
  if(!m) return;
  m.classList.remove("reactWater");
  const picked=[...document.querySelectorAll(".reagent.selected,.reag.selected,.chip.selected,[data-selected='true']")]
    .map(x=>(x.dataset.name||x.dataset.r||x.textContent||"").replace(/\s/g,""));
  const sel=(document.getElementById("sel")?.textContent||"").replace(/\s/g,"");
  const all=(picked.join("|")+"|"+sel);
  if((all.includes("Na")||all.includes("Натрий")) && (all.includes("H₂O")||all.includes("H2O")||all.includes("Су"))){
    void m.offsetWidth;
    m.classList.add("reactWater");
  }
}


function realisticReactionFX(k,r){
 const liq=document.getElementById("liq"), ppt=document.getElementById("ppt"),
       solid=document.querySelector("#solid .solidSample"),
       coat=document.getElementById("metalCoating");
 if(liq){liq.classList.remove("colorShift");void liq.offsetWidth}
 if(ppt)ppt.classList.remove("forming");
 if(coat){coat.classList.remove("show");coat.style.background="transparent"}

 // Metals reacting with water or acid gradually become smaller/disappear.
 const disappearKeys=["Li|H₂O","Na|H₂O","K|H₂O","Ca|H₂O","HCl|Zn"];
 if(disappearKeys.includes(k)&&solid){
   solid.classList.remove("reactAway");void solid.offsetWidth;solid.classList.add("reactAway");
 }

 // Precipitates appear as a cloud first, then settle.
 if(r && r[3]==="precip" && ppt){
   ppt.classList.add("forming");
 }

 // Copper displacement: metal surface gradually gains a copper-coloured deposit.
 if((k==="CuSO₄|Fe"||k==="CuSO₄|Zn") && coat){
   coat.style.background="linear-gradient(145deg,#e09a69,#a95532,#6d2d1d)";
   void coat.offsetWidth; coat.classList.add("show");
   if(liq){liq.style.background=k==="CuSO₄|Fe"?"#88a98d88":"#b9dce255";liq.classList.add("colorShift")}
 }

 // FeSO4/FeCl3/CuSO4 precipitation reactions also visibly shift the liquid.
 if(r && r[3]==="precip" && liq){
   liq.classList.add("colorShift");
 }

 // Calcium + water: slight cloudiness in the virtual solution.
 if(k==="Ca|H₂O" && liq){
   liq.style.background="#d9f1f0aa"; liq.classList.add("colorShift");
 }
}
